name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily: Hyperdash's GraphQL API is private and changes without notice; catch schema drift.
    - cron: "17 6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
